apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 아래 모든 리소스를 sai 방(namespace)에 만든다
namespace: sai

resources:
  - ../../base          # 공통 레시피(api, web)
  - mariadb.yaml
  - redis.yaml
  - ingress.yaml

# base의 이미지 이름에 로컬 태그를 붙인다 → sai-backend:local, sai-frontend:local
images:
  - name: sai-backend
    newTag: local
  - name: sai-frontend
    newTag: local

# base의 sai-api에 로컬 연결 정보를 덧붙인다
patches:
  - path: api-local-patch.yaml