# 로컬 전용 MariaDB (AWS에서는 RDS를 쓰므로 base에 없음)
# 데이터 보관용 디스크 1GB (Pod가 재시작돼도 데이터 유지)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  # 옛 Pod를 완전히 끈 뒤 새 Pod를 켬 (디스크는 동시에 한 Pod만 쓸 수 있음)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4          # CI·로컬과 같은 버전
          # 한글·이모지가 깨지지 않게 utf8mb4 사용
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MARIADB_ROOT_PASSWORD   # 관리용. 앱은 쓰지 않음
              valueFrom:
                secretKeyRef:
                  name: sai-local-db
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE        # 처음 켜질 때 이 DB를 자동 생성
              value: sai_backend
            # 앱 전용 계정: 처음 켜질 때 자동 생성, sai_backend DB에만 권한
            - name: MARIADB_USER
              value: sai_backend
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sai-local-db
                  key: MARIADB_PASSWORD
          ports:
            - containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306