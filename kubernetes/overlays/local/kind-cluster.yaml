# 로컬 검증용 kind 클러스터 (팀 공용 설정)
# 생성: kind create cluster --config kubernetes/overlays/local/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sai
nodes:
  - role: control-plane
    extraPortMappings:
      # 브라우저 → 내 컴퓨터 28080 → kind 노드 30080 → Traefik(입구)
      - containerPort: 30080
        hostPort: 28080
        listenAddress: "127.0.0.1"
        protocol: TCP