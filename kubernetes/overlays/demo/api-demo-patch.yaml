apiVersion: apps/v1
kind: Deployment
metadata:
  name: sai-api
spec:
  template:
    spec:
      serviceAccountName: sai-api              # 3번 신분증 → S3 권한
      terminationGracePeriodSeconds: 60
      # 백엔드 2개를 되도록 서로 다른 AZ·노드에 나눠 배치
      # ScheduleAnyway: 한 AZ가 죽어도 남은 곳에 새 파드를 띄움 (Pending으로 멈추지 않게)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sai-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sai-api
      containers:
        - name: api
          env:
            - name: SPRING_PROFILES_ACTIVE     # → application-prod.yml 사용 (#8에서 준비)
              value: prod
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]       # ALB에서 빠지는 시간이 kind보다 길어서 5초 → 15초