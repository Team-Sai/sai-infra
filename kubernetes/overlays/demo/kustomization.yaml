apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sai

resources:
  - ../../base
  - namespace.yaml
  - serviceaccount.yaml
  - pdb.yaml
  - ingress.yaml

# ⚠️ 빈칸: terraform output의 ECR 주소와, ECR에 올린 이미지 태그로 바꾸기
images:
  - name: sai-backend
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/sai-backend
    newTag: change-me
  - name: sai-frontend
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/sai-frontend
    newTag: change-me

# 워커 노드: AZ별 t3.medium 1대씩, 총 2대 기준 (PR #10 Terraform 구성)
# api·web 각 2개 → AZ마다 1개씩 배치되어 한 AZ 장애에도 서비스 유지
replicas:
  - name: sai-api
    count: 2
  - name: sai-web
    count: 2

patches:
  - path: api-demo-patch.yaml
  - path: service-api-patch.yaml
  - path: service-web-patch.yaml
  - path: web-demo-patch.yaml
  # ⚠️ HTTPS 적용 전(HTTP 80만 열린 상태)에는 실제 계좌·개인정보·금융 데이터를 쓰지 않는다. 테스트 계정·가짜 데이터만 사용.
  # HTTPS 준비되면(도메인 + ACM 인증서) 아래 주석을 풀기 → 443 열기 + http→https 자동 이동
  # - path: ingress-https-patch.yaml