# AWS Load Balancer Controller가 이 파일을 보고 ALB를 만든다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sai
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing        # 인터넷에서 접속 가능한 ALB
    alb.ingress.kubernetes.io/target-type: ip                # 노드를 거치지 않고 Pod IP로 바로 전달
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Pod를 ALB에서 뺄 때 기다리는 시간 (기본 300초 → 30초)
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: Project=sai,Env=demo     # 비용 확인용 이름표
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # ⚠️ ALB는 위에서부터 순서대로 검사 → 구체적인 경로를 위에, "/"는 맨 아래
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sai-api
                port:
                  number: 8080
          - path: /accounts/link/callback
            pathType: Prefix
            backend:
              service:
                name: sai-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sai-web
                port:
                  number: 80